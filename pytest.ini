[pytest]
testpaths = tests
addopts = -ra --strict-markers

# D-015: a NEW deprecation must go red rather than scroll past. The two
# allowances below are F-007's, named so they stay visible instead of becoming
# background noise. Removing an allowance is how we find out the upstream fix
# has landed; adding one is a D-entry.
#
# The category field is left empty on purpose, so each filter matches on its
# MESSAGE whatever class upstream raises it as. Naming a class here was tried
# and was wrong: starlette raises its own StarletteDeprecationWarning, not
# DeprecationWarning, and the mismatch turned the allowance into a collection
# error.
filterwarnings =
    error
    # F-007 (1): fastapi/testclient.py imports starlette's TestClient, which
    # warns that httpx is deprecated in favour of httpx2. Pin-shaped: the fix
    # moves fastapi/starlette and may move the contract snapshot (A-006).
    default:Using `httpx` with `starlette.testclient` is deprecated:
    # F-007 (2): starlette/testclient.py references the anyio.abc.BlockingPortal
    # alias. Upstream's to fix; nothing in this repo touches it.
    default:The anyio.abc.BlockingPortal alias is deprecated:
