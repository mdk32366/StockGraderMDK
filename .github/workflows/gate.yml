# The gate (KEEL Principles 2, 3, 6, 9).
#   test   — runs on every PR and every push to main. Branch protection must
#            REQUIRE this job by its name: "test".
#   deploy — runs only after test passes, only on push to main (i.e. a merge).
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Hermetic suite (no DATABASE_URL, no network needed)
        run: python -m pytest -q

  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://stockgradermdk.fly.dev
    steps:
      - uses: actions/checkout@v4

      # KEEL P4 scar: a secret saved under the wrong NAME left deploy silently
      # dead for weeks. A missing token is a loud failure here, never a no-op.
      - name: Refuse if FLY_API_TOKEN is missing or misnamed
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::GitHub secret FLY_API_TOKEN is missing or saved under a different name."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}

      # "The gate is green" != "the service changed" (PharmFoldMDK 3.4).
      # Fail unless the LIVE service reports the commit we just shipped.
      - name: Verify the live build is this commit
        run: |
          for i in $(seq 1 18); do
            live=$(curl -fsS "$APP_URL/healthz" | python3 -c "import sys,json; print(json.load(sys.stdin).get('build',''))" || true)
            echo "attempt $i: live build = '$live'"
            if [ "$live" = "${{ github.sha }}" ]; then echo "Live build verified."; exit 0; fi
            sleep 10
          done
          echo "::error::Deploy finished but the live service is not running ${{ github.sha }}."
          exit 1

  # D-014: the gate never executes setup.ps1, so F-006 -- a .ps1 that will not
  # PARSE under Windows PowerShell 5.1 -- was invisible to CI. G-9 checks the
  # bytes; only running the script checks the parse.
  #
  # Deliberately a SEPARATE job and NOT a required check. Promoting it to
  # required is an owner ruling, made after it has been green on real runs.
  #
  # A-008 is under test here: that the `py` launcher on a runner finds the 3.12
  # that setup-python installed. If it does not, setup.ps1 throws by design and
  # this job goes red. That red is the finding. Do NOT add a fallback to another
  # Python to make it pass (D-011).
  windows-setup:
    name: windows-setup (PS 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What the py launcher can see (A-008 evidence)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          Write-Host "--- py -0p ---"
          py -0p
          Write-Host "--- py -3.12 ---"
          py -3.12 --version

      - name: Run setup.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: .\setup.ps1

      - name: Offline proof via -SuiteOnly (D-012)
        shell: powershell
        run: .\setup.ps1 -SuiteOnly

