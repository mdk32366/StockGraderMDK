# StockGraderMDK on Fly.io. App names are globally unique and lowercase —
# if "stockgradermdk" is taken, change it HERE, in gate.yml (APP_URL), and in
# D-001, in the same commit.
app = "stockgradermdk"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
